<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand">Red Social</span>
    <div>
      <a class="btn btn-light btn-sm active" href="registro">Registro</a>
      <a class="btn btn-outline-light btn-sm" href="busqueda">Buscar personas</a>
    </div>
  </div>
</nav>

<main class="container" style="max-width: 640px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Registro de usuario</h1>

      <div id="alerta" class="alert d-none" role="alert"></div>

      <form id="formRegistro" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" maxlength="50">
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="apellidoPaterno" class="form-label">Apellido paterno</label>
            <input type="text" class="form-control" id="apellidoPaterno" maxlength="50">
          </div>
          <div class="col-md-6 mb-3">
            <label for="apellidoMaterno" class="form-label">Apellido materno</label>
            <input type="text" class="form-control" id="apellidoMaterno" maxlength="50">
          </div>
        </div>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="correo" maxlength="100">
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="usuario" maxlength="50">
            <div class="form-text">Mínimo 5 caracteres.</div>
          </div>
          <div class="col-md-6 mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" maxlength="100">
            <div class="form-text">Mínimo 8 caracteres.</div>
          </div>
        </div>
        <div class="mb-4">
          <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
          <input type="date" class="form-control" id="fechaNacimiento">
        </div>
        <button type="submit" class="btn btn-primary w-100" id="btnRegistrar">Registrar usuario</button>
      </form>
    </div>
  </div>
</main>

<script>
  const API = 'https://fw-examen-01-back.onrender.com';
  const form = document.getElementById('formRegistro');
  const alerta = document.getElementById('alerta');
  const btn = document.getElementById('btnRegistrar');

  function mostrar(tipo, mensajes) {
    alerta.className = 'alert alert-' + tipo;
    alerta.innerHTML = mensajes.map(m => '<div>' + escapar(m) + '</div>').join('');
    alerta.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function escapar(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }

  function validar(d) {
    const errores = [];
    if (Object.values(d).some(v => !v || !String(v).trim())) {
      errores.push('Todos los campos son obligatorios.');
      return errores;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.correo)) errores.push('El correo electrónico no tiene un formato válido.');
    if (d.usuario.trim().length < 5) errores.push('El usuario debe tener al menos 5 caracteres.');
    if (d.password.length < 8) errores.push('La contraseña debe tener al menos 8 caracteres.');
    const f = new Date(d.fecha_nacimiento);
    if (isNaN(f) || f > new Date()) errores.push('La fecha de nacimiento no es válida.');
    return errores;
  }

  function extraerMensajes(data) {
    if (!data) return ['Ocurrió un error al registrar el usuario.'];
    if (Array.isArray(data.errores)) return data.errores;
    if (Array.isArray(data.errors)) return data.errors.map(e => e.defaultMessage || e.message || String(e));
    if (data.errores && typeof data.errores === 'object') return Object.values(data.errores);
    return [data.mensaje || data.message || data.error || 'Ocurrió un error al registrar el usuario.'];
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const datos = {
      nombre: form.nombre.value,
      apellido_paterno: form.apellidoPaterno.value,
      apellido_materno: form.apellidoMaterno.value,
      correo: form.correo.value,
      usuario: form.usuario.value,
      password: form.password.value,
      fecha_nacimiento: form.fechaNacimiento.value
    };

    const errores = validar(datos);
    if (errores.length) return mostrar('danger', errores);

    btn.disabled = true;
    try {
      const resp = await fetch(API + '/api/v1/usuarios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      if (resp.ok) {
        mostrar('success', ['Usuario registrado correctamente.']);
        form.reset();
      } else {
        const data = await resp.json().catch(() => null);
        mostrar('danger', extraerMensajes(data));
      }
    } catch (err) {
      mostrar('danger', ['No se pudo conectar con el servidor. Si es la primera petición, espera unos segundos e intenta de nuevo.']);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
